name: Publish

# Runs on every v* tag: checks the tag against the package version, builds
# the gem, attaches it to a GitHub Release for the tag, and pushes it to
# RubyGems.org only when the RUBYGEMS_API_KEY repository secret exists.
# Without the secret the push is skipped with a notice and the release asset
# is the install channel (see README "Install").

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Tests
        run: ruby -w -Ilib -Itest -e 'Dir["test/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
      - name: Tag must equal the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(ruby -Ilib -e 'require "skaidb"; print Skaidb::VERSION')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Skaidb::VERSION $ver"
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build the gem
        run: |
          gem build skaidb.gemspec
          ls -l "skaidb-$VERSION.gem"
          gem specification "skaidb-$VERSION.gem" version | grep -q "$VERSION"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release $VERSION" > release-notes.md; fi
          printf '\n---\nInstall: download `skaidb-%s.gem` below and run `gem install ./skaidb-%s.gem`, or `gem '"'"'skaidb'"'"', git: '"'"'https://github.com/porcupin26/skaidb-ruby'"'"', tag: '"'"'v%s'"'"'` in a Gemfile.\n' "$VERSION" "$VERSION" "$VERSION" >> release-notes.md
      - name: GitHub Release with the gem attached
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          files: skaidb-${{ env.VERSION }}.gem
          fail_on_unmatched_files: true
      - name: Push to RubyGems.org (only when RUBYGEMS_API_KEY is set)
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::notice title=RubyGems push skipped::RUBYGEMS_API_KEY secret is not set; nothing was pushed. Install from the release asset: https://github.com/porcupin26/skaidb-ruby/releases/download/v$VERSION/skaidb-$VERSION.gem"
            exit 0
          fi
          gem push "skaidb-$VERSION.gem"
