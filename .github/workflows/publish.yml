name: Publish

# Pushing a version tag (v1.2.3) publishes that version by itself, on a
# GitHub-hosted runner:
#   1. unit tests (in-process fake server, no skaidb needed),
#   2. the tag must equal Skaidb::VERSION (lib/skaidb.rb, the one place the
#      version is defined; the gemspec reads it),
#   3. gem build skaidb.gemspec,
#   4. gem push to https://rubygems.org/gems/skaidb, authenticated with the
#      RUBYGEMS_API_KEY repository secret (Settings → Secrets and variables →
#      Actions), which `gem push` reads as GEM_HOST_API_KEY. Without the
#      secret the push is skipped with a notice and the run still succeeds
#      (push by hand: GEM_HOST_API_KEY=… gem push skaidb-<version>.gem). A
#      version rubygems.org already lists is skipped too, so re-running the
#      tag's workflow is safe,
#   5. a GitHub Release for the tag, notes taken from CHANGELOG.md, with the
#      built .gem attached for installs without registry access.
#
# The secret is a rubygems.org API key with the "Push rubygems" scope, made at
# https://rubygems.org/profile/api_keys by an owner of the gem, from an account
# whose MFA level is "UI and gem signin" ("UI and API" demands an OTP on every
# push and cannot run unattended).

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Tests
        run: ruby -w -Ilib -Itest -e 'Dir["test/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
      - name: Tag must equal the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(ruby -Ilib -e 'require "skaidb"; print Skaidb::VERSION')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag does not match Skaidb::VERSION $ver"
            exit 1
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: Build the gem
        run: |
          gem build skaidb.gemspec
          ls -l "skaidb-$VERSION.gem"
          gem specification "skaidb-$VERSION.gem" version | grep -q "$VERSION"
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release $VERSION" > release-notes.md; fi
          printf '\n---\nInstall: `gem install skaidb` (https://rubygems.org/gems/skaidb), or `gem "skaidb", "~> 1.0"` in a Gemfile. The built `skaidb-%s.gem` is attached below for installs without registry access (`gem install ./skaidb-%s.gem`).\n' "$VERSION" "$VERSION" >> release-notes.md
      - name: Push to RubyGems.org (skipped without the RUBYGEMS_API_KEY secret, or when the version is already there)
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          listed() {  # succeeds when rubygems.org lists skaidb $1
            curl -fsS -o "$RUNNER_TEMP/versions.json" https://rubygems.org/api/v1/versions/skaidb.json 2>/dev/null || return 1
            ruby -rjson -e 'exit JSON.parse(File.read(ARGV[0])).any? { |v| v["number"] == ARGV[1] }' "$RUNNER_TEMP/versions.json" "$1"
          }
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::notice title=RubyGems push skipped::RUBYGEMS_API_KEY secret is not set; nothing was pushed. Add it under Settings → Secrets and variables → Actions (a rubygems.org API key with the push scope), or push by hand: GEM_HOST_API_KEY=… gem push skaidb-$VERSION.gem (https://rubygems.org/gems/skaidb)"
            echo "RubyGems.org: push skipped, the RUBYGEMS_API_KEY secret is not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if listed "$VERSION"; then
            echo "::notice title=RubyGems push skipped::skaidb $VERSION is already on rubygems.org; nothing was pushed"
            echo "RubyGems.org: already lists skaidb $VERSION, nothing pushed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # stdin closed and a hard timeout: an OTP prompt cannot hang the job
          set -o pipefail
          if ! timeout 300 gem push "skaidb-$VERSION.gem" < /dev/null 2>&1 | tee "$RUNNER_TEMP/push.log"; then
            if grep -qi 'MFA' "$RUNNER_TEMP/push.log"; then
              echo "::error title=RubyGems refused the push::the rubygems.org account behind RUBYGEMS_API_KEY needs MFA at the 'UI and gem signin' level (https://rubygems.org/settings/edit) for this gem; enable it, then re-run this workflow"
            else
              echo "::error title=RubyGems refused the push::RUBYGEMS_API_KEY must be a rubygems.org API key with the push scope, owned by an owner of the skaidb gem (https://rubygems.org/profile/api_keys)"
            fi
            exit 1
          fi
          for _ in $(seq 1 24); do
            if listed "$VERSION"; then
              echo "rubygems.org lists skaidb $VERSION"
              echo "RubyGems.org: pushed skaidb $VERSION — https://rubygems.org/gems/skaidb/versions/$VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::gem push succeeded but https://rubygems.org/api/v1/versions/skaidb.json does not list $VERSION yet (the index can lag a few minutes)"
          echo "RubyGems.org: pushed skaidb $VERSION (the index had not caught up when the run checked)" >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub Release with the gem attached
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          files: skaidb-${{ env.VERSION }}.gem
          fail_on_unmatched_files: true
      - name: Summary
        run: |
          echo "GitHub Release: ${{ steps.gh_release.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
